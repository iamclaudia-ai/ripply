# Publishes ripply to npm with trusted publishing (OIDC). No npm token is
# stored anywhere: npm trusts this workflow file in this repo, configured on
# npmjs.com under ripply → Settings → Trusted Publisher. Because the repo is
# public, npm also attaches a provenance attestation to each release.
#
# Release: bump `version` in package.json, update CHANGELOG.md, merge, then
#   git tag -a vX.Y.Z -m "ripply X.Y.Z" && git push origin vX.Y.Z
# To publish an existing tag (a failed run, or a tag pushed before this
# workflow existed): gh workflow run release.yml -f tag=vX.Y.Z
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v0.2.1)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Tag matches package.json version
        run: |
          version="v$(jq -r .version package.json)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun test
        env:
          RIPPLY_TEST_PG: postgres://postgres:postgres@localhost:5432

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm supports trusted publishing (>= 11.5.1)
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v is too old for trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
      - run: npm publish --access public
